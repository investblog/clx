openapi: 3.1.0
info:
  title: clx management API
  version: 0.8.0
  description: |
    The /v1 API of clx (docs/spec.md §15). The clx.cx page is a thin client over the same endpoints.
    Authorization: `Bearer <access token>` from a signed-in page, or `Bearer clx_…` — an API key
    (one on the `free` plan, up to 5 on `api`). Every POST, PUT, PATCH and DELETE takes an `Idempotency-Key` header, required
    with an API key; a repeat with the same body replays the first answer for 24 hours.
    Errors: `{ "error": { "code", "message", "details"? } }`. This file grows with each stage; a
    test checks that every route in the code is here and back.
servers:
  - url: https://clx.cx
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]{1,200}$' }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Partner money moves only with one: a retry with the same key never moves it twice.'
      schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]{1,200}$' }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$', description: 'an id of clx: 22 characters of base64url' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable codes: unauthorized, invalid_request, not_found, payload_too_large,
                limit_reached, service_full, idempotency_conflict, operation_in_progress,
                scope_required, session_required, key_already_issued,
                account_taken, already_connected, account_not_ready, invalid_bootstrap,
                bootstrap_permission_error, permission_catalog, orphan_not_deleted,
                token_rights_mismatch, token_check_failed, renew_lost, rate_limited, cloudflare_unavailable,
                not_configured, internal. In an account's or operation's `error` (the install, §4):
                name_taken, resource_drift, cron_limit, permission_error, revoked, self_check_timeout,
                credentials_missing, credentials_unreadable (clx cannot open the stored token),
                cloudflare_error. Sites: zone_not_found, site_exists, route_conflict, site_not_active,
                update_required (external sites need a newer clx-edge),
                route_not_ours (a route clx made was changed outside clx and left in place).
                Sign-up: email_unconfirmed (POST /v1/accounts before the address is confirmed),
                invalid_password, balance_not_empty (DELETE /v1/me while money is on the balance or the partner wallet or still moving, §18).
                Billing (docs/spec.md §18): insufficient_balance (Pro needs $9 on the balance), invoice_limit (3 pending top-ups),
                payments_unavailable (crypto top-ups not set up or the processor down),
                refund_unavailable (a top-up never credited, older than 90 days or refunded
                already), refund_open (a refund of that top-up is asked for already), paused (an
                object beyond the free plan's limits: it can be read and deleted, not changed).
                Links: link_exists (the code is taken on that link host), link_host_not_ready (links go
                on an active host only), link_host_in_use
                (DELETE /v1/link-hosts/{id} while live links are on it). In a link host's `error`:
                dns_record_exists (the named host already has a DNS record — never taken over),
                domain_taken (another worker's custom domain), domain_not_ours.
            message: { type: string }
            details: { type: object }
    Key:
      type: object
      properties:
        id: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string, enum: [accounts, sites, links, reports, billing] } }
        allow_accounts: { type: [array, 'null'], items: { type: string } }
        allow_ips: { type: [array, 'null'], items: { type: string } }
        created_at: { type: string, format: date-time }
        last_used: { type: [string, 'null'], format: date }
        paused_at: { type: [string, 'null'], format: date-time, description: 'set while the key is beyond the free plan''s limits (docs/spec.md §18): it is refused until Pro is on again' }
    Account:
      type: object
      properties:
        id: { type: string }
        cf_account_id: { type: string }
        name: { type: string }
        state:
          type: string
          enum: [pending, bootstrap_lost, connected, installing, ready, permission_error, revoked, resource_drift, no_connection]
          description: 'pending — the connect is running, or stopped on a passing failure (5xx other than token_rights_mismatch, token_check_failed, permission_catalog, which end it) and waits for the same request again (same Idempotency-Key); bootstrap_lost — a connect left pending for an hour, or one that died before clx stored its working token: revoke the token its error names and connect again; connected — token ready, clx-edge not installed; installing — the install runs; ready — installed and serving, go on (the worker confirms itself on its first cron: meanwhile `operation` shows the install at step selfcheck, for up to 15 minutes, and if no confirmation comes error.warnings says not_confirmed — nothing to wait for either way); no_connection — installed, but no push from the worker for 26 hours (sites can still be added; its next push makes it ready again)'
        token:
          type: [object, 'null']
          properties:
            name: { type: string, description: 'clx-<operation id>' }
            expires_at: { type: string, format: date-time }
        error: { type: [object, 'null'], description: 'code and details, or warnings such as bootstrap_not_deleted' }
        edge:
          type: [object, 'null']
          description: The installed clx-edge, from its upload on (the worker's own confirmation is not needed)
          properties:
            bundle: { type: string, description: sha256 of the bundle }
            up_to_date: { type: boolean }
            schema: { type: integer }
            installed_at: { type: string, format: date-time }
        push:
          type: [object, 'null']
          description: The worker's own report from its last push of totals (hourly)
          properties:
            at: { type: string, format: date-time }
            bundle: { type: string, description: sha256 of the bundle the worker runs }
            schema: { type: [integer, 'null'] }
            queue: { type: integer, description: queue parts and final days waiting to be sent }
            error: { type: [string, 'null'], description: the worker's last error }
            dropped: { type: object, additionalProperties: { type: integer }, description: 'items dropped unsent, by reason: budget, invalid, unknown_target, too_old, busy, expired' }
        advice:
          type: [object, 'null']
          description: 'When to move this Cloudflare account to Workers Paid, from its measured use over the last 7 complete UTC days; on an account already on Workers Paid (`paid`), only the current size of clx-edge; recomputed daily, null until first computed'
          properties:
            level: { type: string, enum: [ok, watch, upgrade_soon, over], description: 'the worst metric: over — a limit was reached (or the database is at backpressure, 400 MB); upgrade_soon — busiest day ≥ 80% or the limit within 7 days; watch — ≥ 60% or within 30 days' }
            metric: { type: [string, 'null'], enum: [requests, writes, reads, size, null] }
            metrics:
              type: object
              description: 'requests, writes, reads — per day for the whole account, against 100,000 / 100,000 / 5,000,000; size — clx-edge now, against 500 MB (on Workers Paid against 400 MB, where the worker stops keeping details)'
              additionalProperties:
                type: object
                properties:
                  level: { type: string, enum: [ok, watch, upgrade_soon, over] }
                  limit: { type: integer }
                  busiest: { type: object, properties: { day: { type: [string, 'null'], format: date }, value: { type: integer } } }
                  forecast: { type: [string, 'null'], format: date, description: 'the day the trend reaches the limit, when within 30 days' }
            unavailable: { type: array, items: { type: string, enum: [analytics, size] }, description: 'what could not be read — not guessed' }
            suggest: { type: string, enum: [shorter_hourly_retention], description: 'size alone is the problem' }
            paid: { type: boolean, enum: [true], description: 'the account is on Workers Paid (read from its entitlements): requests, writes and reads are not judged — no daily limit stops them — only size is, and no e-mail is sent' }
            at: { type: string, format: date-time }
        operation:
          type: [object, 'null']
          description: The latest operation on the account (GET /v1/accounts/{id} only)
          properties:
            kind: { type: string, enum: [connect, renew, install, update, disconnect] }
            state: { type: string, enum: [running, done, failed] }
            step: { type: string }
            error: { type: [object, 'null'] }
            updated_at: { type: string, format: date-time }
        link_hosts:
          type: array
          items: { $ref: '#/components/schemas/LinkHost' }
          description: The account's link hosts (GET /v1/accounts/{id} only)
        paused_at: { type: [string, 'null'], format: date-time, description: 'set while the account is beyond the free plan''s limits (docs/spec.md §18): its sites and links are withdrawn from the worker, nothing new can be added' }
        created_at: { type: string, format: date-time }
    LinkHost:
      type: object
      properties:
        id: { type: string }
        account_id: { type: string }
        site_id: { type: [string, 'null'], description: 'the site it was made for; null for a host the user named' }
        host: { type: string, description: 'k7q.example.com — a random 3-character label under the site''s host, or the named host' }
        state:
          type: string
          enum: [pending, active, conflict, deleted]
          description: 'pending — its custom domain is being made (the cron retries); active — Cloudflare made it, with its DNS record and certificate; conflict — see error'
        config: { type: string, enum: [pending, synced], description: 'whether the worker has it yet; short links answer once active and synced' }
        error: { type: [object, 'null'] }
        created_at: { type: string, format: date-time }
    Rule:
      type: object
      required: [url]
      description: 'matches when the visitor''s country is in countries (if given) and their device in devices (if given)'
      properties:
        countries: { type: array, items: { type: string, pattern: '^[A-Z]{2}$' } }
        devices: { type: array, items: { type: string, enum: [mobile, desktop] } }
        url: { type: string, format: uri, description: 'https:// only, up to 2048 characters, not on a link host of the account' }
    Link:
      type: object
      properties:
        id: { type: string }
        account_id: { type: string }
        link_host_id: { type: string }
        code: { type: string, description: 'unique on its link host' }
        short_url: { type: [string, 'null'], description: 'https://<link host>/<code>' }
        url: { type: string, description: 'where it leads when no rule matches' }
        rules: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Rule' }, description: 'the first match wins' }
        state: { type: string, enum: [active, deleted] }
        config: { type: string, enum: [pending, synced], description: 'whether the worker has this version of the link yet' }
        paused_at: { type: [string, 'null'], format: date-time, description: 'set while the link is beyond the free plan''s limits (docs/spec.md §18): it answers 404 and cannot be changed' }
        clicks_7d: { type: integer, description: 'clicks of the last 7 closed UTC days (GET /v1/links only, and only with the reports scope)' }
        created_at: { type: string, format: date-time }
    Site:
      type: object
      properties:
        id: { type: string }
        account_id: { type: string }
        host: { type: string }
        kind: { type: string, enum: [zone, external], description: 'zone — the host is in a zone of the account and the counter answers on it; external — a site not on Cloudflare (Pro), counted on collector_host (docs/spec.md §5)' }
        collector_host: { type: [string, 'null'], description: "an external site's: the host of the account's zones its beacons go to; null for zone" }
        state:
          type: string
          enum: [route_pending, active, route_conflict, deleted]
          description: 'route_pending — the route is still to be made (the cron retries); route_conflict — another worker holds the pattern, see error'
        path: { type: string, description: 'the per-site path the counter answers under, e.g. /lumora or /kavi/tesomu' }
        snippet:
          type: [object, 'null']
          description: Embed one of the two at build time; stable until rotate (an external site is never rotated)
          properties:
            inline: { type: string, description: '<script>…</script>, under 600 bytes for a zone site; an external site''s also names its collector host' }
            script_tag: { type: string, description: '<script src="/<path>/<s>.js"> with defer (the order of the attributes varies by site); an external site''s src is https://<collector_host>/<path>/<s>.js' }
        excluded_paths: { type: array, items: { type: string } }
        config: { type: string, enum: [pending, synced], description: 'whether the worker has this version of the site yet' }
        paused_at: { type: [string, 'null'], format: date-time, description: 'set while the site is beyond the free plan''s limits (docs/spec.md §18): it is not counted and cannot be changed' }
        retiring: { type: array, items: { type: object, properties: { path: { type: string }, until: { type: string, format: date-time } } }, description: 'old paths still counted after a rotation' }
        error: { type: [object, 'null'] }
        created_at: { type: string, format: date-time }
        views_7d: { type: array, items: { type: integer }, minItems: 7, maxItems: 7, description: 'views of each of the last 7 closed UTC days, oldest first (GET /v1/sites only, and only with the reports scope)' }
        views_today: { type: integer, description: "today's views so far, as of the last hour the worker sent (GET /v1/sites only, and only with the reports scope)" }
        counted: { type: boolean, description: 'whether the counter has counted a view of this site yet (GET /v1/sites only, and only with the reports scope)' }
    Top:
      type: array
      maxItems: 10
      description: 'the top 10 by count; "(other)" holds what went over the detail caps'
      items: { type: object, properties: { key: { type: string }, n: { type: integer } } }
    Report:
      type: object
      properties:
        period: { type: string, enum: [today, 7d, 30d] }
        from: { type: string, format: date, description: first UTC day }
        to: { type: string, format: date, description: last UTC day — today }
        as_of: { type: [string, 'null'], format: date-time, description: 'today is counted up to this moment. A site: the end of the latest closed hour the worker sent (hours arrive up to an hour late), null before its first push. A link: the moment of the live read of the account''s database' }
        totals:
          type: object
          properties:
            views: { type: integer }
            bots: { type: integer }
            visitors: { type: integer, description: the sum of daily unique visitors }
        series:
          type: array
          description: 'today — one point per hour up to as_of; 7d/30d — one per day (with visitors)'
          items: { type: object, properties: { at: { type: string, format: date-time }, views: { type: integer }, bots: { type: integer }, visitors: { type: integer } } }
        incomplete: { type: boolean, description: "today's hours were refused over the account's write budget; daily totals stay exact" }
        breakdowns:
          type: [object, 'null']
          description: 'only with breakdowns=1; read from the account''s own database, null when unavailable'
          properties:
            pages: { $ref: '#/components/schemas/Top' }
            sources: { $ref: '#/components/schemas/Top' }
            countries: { $ref: '#/components/schemas/Top' }
            devices: { $ref: '#/components/schemas/Top' }
            browsers: { $ref: '#/components/schemas/Top' }
            os: { $ref: '#/components/schemas/Top' }
            bots: { $ref: '#/components/schemas/Top' }
            flows:
              type: array
              maxItems: 200
              description: 'a link only: clicks by source and destination together, the top 200 by count. `to` is where the clicks were sent: the matched rule''s conditions and URL, `AT,DE;mobile>https://…` (sorted; past 40 countries the first 40 and `+N#<fingerprint of the whole list>`), or `>https://…` for the main URL (the first 512 characters, also the keys of a link''s `pages`); "" for clicks counted by a worker that did not record it yet, "(other)" for what went over the detail caps'
              items: { type: object, properties: { source: { type: string }, to: { type: string }, n: { type: integer } } }
        unavailable:
          type: string
          enum: [not_installed, cloudflare, rate_limited]
          description: 'why breakdowns (and a link''s today) are not there: the worker is not installed or the token is gone; Cloudflare failed or took over 5 s; over 30 reads of the account databases a minute for this clx user (each cached 5 minutes)'
    Billing:
      type: object
      properties:
        balance_micro_usd: { type: integer }
        pro:
          type: object
          properties:
            'on': { type: boolean, description: 'Pro is on — paid, or given by an operator' }
            given: { type: boolean, description: 'given by an operator: never charged' }
            since: { type: [string, 'null'], format: date, description: 'the first day of the open period' }
            paid_through: { type: [string, 'null'], format: date, description: 'the last day of the unbroken run of paid days' }
            grace_until: { type: [string, 'null'], format: date-time, description: 'a day is unpaid: Pro works until then; still unpaid, the account returns to free' }
            price_micro_usd: { type: integer, description: '9,000,000 — per 30 days' }
            day_micro_usd: { type: integer, description: '300,000 — what a day costs' }
        journal:
          type: array
          description: the last 50 rows, newest first
          items:
            type: object
            properties:
              id: { type: integer }
              type: { type: string, enum: [deposit, charge, bonus, adjustment, refund, partner_transfer] }
              amount_micro_usd: { type: integer, description: 'negative for a charge or a refund' }
              day: { type: [string, 'null'], format: date, description: 'the day a charge pays' }
              invoice_id: { type: [string, 'null'] }
              note: { type: [string, 'null'] }
              at: { type: string, format: date-time }
        invoices:
          type: array
          description: 'the last 10 top-ups, newest first'
          items:
            allOf:
              - $ref: '#/components/schemas/Invoice'
              - type: object
                properties:
                  refundable_micro_usd: { type: integer, description: 'what a refund request may still take from this top-up: under 90 days old, something left, no request open; 0 otherwise' }
        refunds: { type: array, items: { $ref: '#/components/schemas/Refund' }, description: 'the last 10 refund requests, newest first' }
    Partner:
      type: object
      properties:
        code: { type: string, description: 'your partner code' }
        links:
          type: object
          properties:
            site: { type: string, description: 'clx.cx with ?ref=' }
            bot: { type: [string, 'null'], description: 'the Telegram bot with start=ref_' }
        rate_bp: { type: integer, description: 'the commission, basis points (3000 = 30%)' }
        hold_days: { type: integer }
        payout_min_micro_usd: { type: integer }
        referrals: { type: integer, description: 'accounts made with your code' }
        wallet:
          type: object
          properties:
            total_micro_usd: { type: integer }
            available_micro_usd: { type: integer, description: 'may be below zero after a clawback' }
            held_micro_usd: { type: integer }
        journal:
          type: array
          description: 'the last 50 rows, newest first'
          items:
            type: object
            properties:
              id: { type: integer }
              type: { type: string, enum: [commission, clawback, transfer, payout, payout_return] }
              amount_micro_usd: { type: integer }
              invoice_id: { type: [string, 'null'] }
              available_at: { type: [string, 'null'], format: date-time, description: 'when a commission is no longer held' }
              note: { type: [string, 'null'] }
              at: { type: string, format: date-time }
        payouts:
          type: array
          description: 'the last 10, newest first'
          items:
            type: object
            properties:
              id: { type: integer }
              amount_micro_usd: { type: integer }
              address: { type: string }
              status: { type: string, enum: [requested, paid, rejected] }
              txid: { type: [string, 'null'] }
              created_at: { type: string, format: date-time }
              settled_at: { type: [string, 'null'], format: date-time }
    Refund:
      type: object
      properties:
        id: { type: string }
        invoice_id: { type: string, description: 'the top-up refunded' }
        rail: { type: string, enum: [crypto, stars] }
        address: { type: [string, 'null'], description: 'where crypto goes; null for Stars' }
        status: { type: string, enum: [requested, pending, done, declined], description: 'pending: taken from the balance, on its way' }
        amount_micro_usd: { type: [integer, 'null'], description: 'taken from the balance, once an operator made it; crypto is sent less the network fee' }
        txid: { type: [string, 'null'], description: 'the crypto transfer, once sent' }
        created_at: { type: string, format: date-time }
        settled_at: { type: [string, 'null'], format: date-time }
    Invoice:
      type: object
      properties:
        id: { type: string }
        rail: { type: string, enum: [crypto, stars] }
        usd_micro_usd: { type: integer, description: 'the nominal; what is credited is what arrived' }
        coin: { type: string, description: 'USDT_TRC20, USDT_BSC, USDT_ERC20, USDC_ERC20; XTR for Stars' }
        coin_label: { type: string }
        stars: { type: [integer, 'null'] }
        status: { type: string, enum: [pending, paid, expired, review, void], description: 'expired may still turn paid if crypto comes late (checked for 30 days); review waits for an operator' }
        address: { type: [string, 'null'], description: 'where to send, while pending — null when the processor gave no whole quote: use pay_url' }
        amount: { type: [string, 'null'], description: 'the exact amount of the coin to send, fees included, while pending' }
        pay_url: { type: [string, 'null'], description: "the processor's own payment page, while pending" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
  responses:
    Error:
      description: An error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /v1/me:
    get:
      summary: The caller — user, plan, limits, current use
      description: |
        Sign-up, e-mail confirmation and password reset are not part of /v1: they live under /auth
        with the page session (docs/spec.md §9). Until `email_confirmed`, POST /v1/accounts answers
        `email_unconfirmed`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: object, properties: { id: { type: integer }, email: { type: string }, email_confirmed: { type: boolean }, locale: { type: string, enum: [en, ru], description: "The language of the app after sign-in and of clx's e-mails" } } }
                  plan: { type: string, enum: [free, api] }
                  limits: { type: object, description: "the plan's limits", properties: { cf_accounts: { type: integer }, sites: { type: integer }, external_sites: { type: integer, description: 'of the sites, those not on Cloudflare: 0 on free' }, links: { type: integer }, rules_per_link: { type: integer }, api_keys: { type: integer } } }
                  use: { type: object, description: "what is in use now", properties: { cf_accounts: { type: integer }, api_keys: { type: integer } } }
                  via: { type: string, enum: [session, key, telegram] }
                  telegram: { type: [object, 'null'], description: 'the Telegram user linked to the account (docs/spec.md §17)', properties: { id: { type: integer, description: 'the Telegram user id' }, username: { type: [string, 'null'] }, linked_at: { type: string, format: date-time } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      summary: Set the user's language (page session only; also the Telegram bot's /lang)
      description: |
        The app after sign-in and every e-mail of clx speak it; sign-up sets it to the language of
        the page signed up from.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [locale], properties: { locale: { type: string, enum: [en, ru] } } }
      responses:
        '200': { description: Set, content: { application/json: { schema: { type: object, properties: { locale: { type: string, enum: [en, ru] } } } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete the account (page session only, with the password)
      description: |
        Every connected Cloudflare account is disconnected first (clx-edge, its database and routes
        removed where the token still can — what could not be is listed in `left`, the working tokens
        to revoke in `revoke_tokens`); then the totals go at once, and the user with the keys, sites
        and links. Refused with `balance_not_empty` while money is on the balance or the partner wallet, or a
        payment, refund or payout is open, a referral's deposit is under 90 days old or has no commission
        yet, or a referral's refund is open (docs/spec.md §18); the journal is kept for accounting without the address.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string } } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  left: { type: array, items: { type: string } }
                  revoke_tokens: { type: array, items: { type: string } }
        default: { $ref: '#/components/responses/Error' }
  /v1/me/telegram:
    delete:
      summary: Unlink the Telegram linked to the account (page session only)
      description: |
        The Telegram bot (docs/spec.md §17) acts for the account it is linked to; this ends the link.
        A password reset ends it too.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Unlinked, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/keys:
    get:
      summary: API keys (page session only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { keys: { type: array, items: { $ref: '#/components/schemas/Key' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Issue an API key (page session only; 1 on the free plan, 5 on api — `limit_reached` over it); the key is in this answer only
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes: { type: array, items: { type: string, enum: [accounts, sites, links, reports, billing] } }
                allow_accounts: { type: array, items: { type: string, pattern: '^[0-9a-f]{32}$' } }
                allow_ips: { type: array, items: { type: string } }
      responses:
        '201': { description: Issued — `key` is shown once }
        '409': { description: 'key_already_issued — a replay of the same Idempotency-Key' }
        default: { $ref: '#/components/responses/Error' }
  /v1/keys/{id}:
    patch:
      summary: Change an API key's allow lists in place (page session only); the key itself stays
      description: |
        A field left out stays as it is; `null` lifts the limit — every Cloudflare account of the
        user, those connected later too, or every IP.
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf: [{ required: [allow_accounts] }, { required: [allow_ips] }]
              properties:
                allow_accounts: { type: [array, 'null'], minItems: 1, description: 'At most the plan''s Cloudflare accounts', items: { type: string, pattern: '^[0-9a-f]{32}$' } }
                allow_ips: { type: [array, 'null'], minItems: 1, maxItems: 20, items: { type: string } }
      responses:
        '200': { description: The key as it is now, content: { application/json: { schema: { $ref: '#/components/schemas/Key' } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      summary: Revoke an API key (page session only)
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Revoked }
        default: { $ref: '#/components/responses/Error' }
  /v1/accounts:
    get:
      summary: Connected Cloudflare accounts (scope accounts or sites)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { accounts: { type: array, items: { $ref: '#/components/schemas/Account' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Connect a Cloudflare account with a bootstrap token (scope accounts)
      description: |
        The bootstrap token (Account Settings — Read + Account API Tokens — Edit, which the API names
        Write; one day) is used
        within this request and deleted; it is never stored. The account then goes on to the
        install of clx-edge (§4) — poll GET for its state: `installing`, then `ready` once the script,
        its database and cron are in place (seconds; the worker's own confirmation may follow
        minutes later, or never — then `error.warnings` says `not_confirmed`), or `connected` with an `error`.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [cf_account_id, bootstrap_token]
              properties:
                cf_account_id: { type: string, pattern: '^[0-9a-f]{32}$' }
                bootstrap_token: { type: string }
      responses:
        '202': { description: Connected, content: { application/json: { schema: { type: object, properties: { account: { $ref: '#/components/schemas/Account' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/accounts/{id}:
    get:
      summary: One connected account (scope accounts or sites), with its latest operation and link host
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { account: { $ref: '#/components/schemas/Account' } } } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      summary: Disconnect (scope accounts) — delete clx-edge and its database, then the record
      description: |
        The answer names the working token to revoke in Cloudflare (it cannot delete itself), and in
        `left` whatever clx could not delete — the token is revoked, a right is missing, or the
        worker was changed outside clx — for the user to remove by hand.
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  revoke_token: { type: [string, 'null'] }
                  left: { type: array, items: { type: string } }
        default: { $ref: '#/components/responses/Error' }
  /v1/accounts/{id}/zones:
    get:
      summary: The account's zones (scope accounts or sites) — to pick a site's or link host's zone from
      description: |
        Read live from Cloudflare with the working token, sorted by name; at most 1,000, `truncated`
        past that. A host is still checked against its zone when it is added.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  zones:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        status: { type: string, description: "Cloudflare's zone status: active, pending, …" }
                  truncated: { type: boolean }
        default: { $ref: '#/components/responses/Error' }
  /v1/accounts/{id}/install:
    post:
      summary: Install clx-edge again (scope accounts) — after a failed install, or to reinstall
      description: |
        The recorded database is kept; the worker gets a new key (the previous one is accepted for a
        day). A clx-edge worker or database clx did not create is never touched (`name_taken`), nor
        a worker changed outside clx (`resource_drift`). Poll GET for the state.
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Started, content: { application/json: { schema: { type: object, properties: { account: { $ref: '#/components/schemas/Account' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/accounts/{id}/token:
    post:
      summary: Renew the working token with a new bootstrap token (scope accounts)
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [bootstrap_token]
              properties:
                bootstrap_token: { type: string }
      responses:
        '200': { description: Renewed }
        default: { $ref: '#/components/responses/Error' }
  /v1/sites:
    get:
      summary: Sites (scope sites); `account_id` narrows to one account
      parameters: [{ name: account_id, in: query, required: false, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { sites: { type: array, items: { $ref: '#/components/schemas/Site' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Add a site (scope sites) — the zone is found in the account, the route made, the config synced
      description: |
        The account must be `ready`. The answer carries the snippet at once; `config` turns
        `synced` once the worker has the site (seconds), and the counter answers from then on.

        With `collector_host` it is an external site — one not on Cloudflare (Pro only,
        docs/spec.md §5): its `host` must be in no zone of the account (`invalid_request`), the
        route is made on `collector_host`, a host of the account's zones that already answers
        through Cloudflare (clx makes no DNS record) and is no link host. Its snippet sends a CORS
        request to that host, so a page whose CSP limits `connect-src` (or `script-src`, for the
        tag) must allow it. `limit_reached` (limit 0) on free; `update_required` while the
        account's clx-edge predates external sites; `operation_in_progress` while another
        operation holds the account.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [account_id, host]
              properties:
                account_id: { type: string }
                host: { type: string, description: 'example.com or a subdomain of a zone in that account; with collector_host, a host in none' }
                collector_host: { type: string, description: 'makes an external site: a host of a zone in that account, other than host' }
                excluded_paths: { type: array, maxItems: 50, items: { type: string, pattern: '^/' } }
      responses:
        '202': { description: Added, content: { application/json: { schema: { type: object, properties: { site: { $ref: '#/components/schemas/Site' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sites/{id}:
    get:
      summary: One site (scope sites)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { site: { $ref: '#/components/schemas/Site' } } } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      summary: Change the excluded paths (scope sites)
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                excluded_paths: { type: array, maxItems: 50, items: { type: string, pattern: '^/' } }
      responses:
        '200': { description: Changed, content: { application/json: { schema: { type: object, properties: { site: { $ref: '#/components/schemas/Site' } } } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      summary: Remove the site's routes (scope sites); the site stays as `deleted`, its totals with it
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object, properties: { site: { $ref: '#/components/schemas/Site' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sites/{id}/report:
    get:
      summary: Totals and series of the site (scope reports); with breakdowns=1 also the top pages, sources, countries, devices, browsers, OS and bots
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: period, in: query, schema: { type: string, enum: [today, 7d, 30d], default: today } }
        - { name: breakdowns, in: query, schema: { type: string, enum: ['1'] }, description: 'read the breakdowns from the account''s database (cached 5 minutes)' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { report: { $ref: '#/components/schemas/Report' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/link-hosts:
    get:
      summary: Link hosts (scope links); `account_id` narrows to one account
      parameters: [{ name: account_id, in: query, required: false, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { link_hosts: { type: array, items: { $ref: '#/components/schemas/LinkHost' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Add a link host (scope links) — one per site if wished; clx makes it a custom domain of clx-edge
      description: |
        `{site_id}` makes `<label>.<site host>` (a leading `www.` dropped) with a random label of 3
        characters; `{account_id, host}` takes a host you name, in one of the account's zones. The
        account must be `ready`. clx makes the host a Workers Custom Domain of clx-edge: Cloudflare
        creates its DNS record and certificate, so you create no record. A host that already has a
        DNS record is never taken over: a random label is tried again with another, a named host
        ends `conflict` (`dns_record_exists`). Answers `202`; poll GET until `state` is `active` and
        `config` is `synced` (usually seconds). Up to the plan's site limit per user. An external
        site has no zone for `{site_id}` (`invalid_request`), and a site's host or collector host
        cannot be a link host.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - { required: [site_id], not: { anyOf: [{ required: [account_id] }, { required: [host] }] } }
                - { required: [account_id, host], not: { required: [site_id] } }
              properties:
                site_id: { type: string, description: 'the site to make a host for; alone' }
                account_id: { type: string, description: 'with host' }
                host: { type: string, description: 'with account_id: a host of a zone in that account, such as k7q.example.com' }
      responses:
        '202': { description: Started, content: { application/json: { schema: { type: object, properties: { link_host: { $ref: '#/components/schemas/LinkHost' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/link-hosts/{id}:
    get:
      summary: One link host (scope links)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { link_host: { $ref: '#/components/schemas/LinkHost' } } } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      summary: Delete a link host (scope links) — refused while live links are on it; its custom domain and DNS record go
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object, properties: { link_host: { $ref: '#/components/schemas/LinkHost' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/links:
    get:
      summary: Links (scope links); `account_id` narrows to one account
      parameters: [{ name: account_id, in: query, required: false, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { links: { type: array, items: { $ref: '#/components/schemas/Link' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      summary: Add a short link (scope links) on one of the account's link hosts
      description: |
        A click is a `302` to the first matching rule's URL, else `url`; it is counted as a view of
        the link, with source `qr` when the address carries `?q` (the QR code's) — or as a bot when
        the client is one (curl, a script, a crawler: it is redirected all the same). `config` turns
        `synced` once the worker has the link (seconds).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [link_host_id, url]
              properties:
                link_host_id: { type: string, description: 'the link host it lives on (POST /v1/link-hosts)' }
                code: { type: string, pattern: '^[A-Za-z0-9_-]{3,32}$', description: 'a random 6 characters when not given' }
                url: { type: string, format: uri, description: 'https:// only, up to 2048 characters, not on a link host of the account' }
                rules: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Rule' } }
      responses:
        '201': { description: Added, content: { application/json: { schema: { type: object, properties: { link: { $ref: '#/components/schemas/Link' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/links/{id}:
    get:
      summary: One link (scope links)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { link: { $ref: '#/components/schemas/Link' } } } } } }
        default: { $ref: '#/components/responses/Error' }
    patch:
      summary: Change the URL or the rules (scope links); the code stays
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                rules: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Rule' } }
      responses:
        '200': { description: Changed, content: { application/json: { schema: { type: object, properties: { link: { $ref: '#/components/schemas/Link' } } } } } }
        default: { $ref: '#/components/responses/Error' }
    delete:
      summary: Remove the link (scope links); its code is freed, the link stays as `deleted` with its totals
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object, properties: { link: { $ref: '#/components/schemas/Link' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/links/{id}/qr.svg:
    get:
      summary: The QR code of the link (scope links) — an SVG of `https://<link host>/<code>?q`
      description: |
        The `?q` makes a scan count with source `qr`; the worker does not pass it on. One `<rect>` and
        one `<path>`, integer coordinates, a quiet zone of 4 modules, error correction M. Without
        `size` the SVG has no width and height and scales to its container. It carries the link's own
        host, which never changes; deleting that host stops its printed codes.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 64, maximum: 9999 }, description: pixels }
      responses:
        '200': { description: The SVG, content: { image/svg+xml: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/links/{id}/report:
    get:
      summary: 'Clicks of the link (scope reports); with breakdowns=1 also sources, countries, devices, browsers, OS, bots, its destinations (in `pages`: where the clicks were sent, by rule or the main URL) and `flows`, sources and destinations together'
      description: |
        Closed days come from clx.cx; today (and any day the worker has not sent yet) is read live
        from the account's own database in one read with the breakdowns — `as_of` is the moment of
        that read (cached up to 5 minutes, so it can be that much older than the answer). When that database
        cannot be read, the totals hold clx.cx's days only, the series of `today` is empty and
        `unavailable` says why. `incomplete` is always false: a link's days are never refused.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: period, in: query, schema: { type: string, enum: [today, 7d, 30d], default: today } }
        - { name: breakdowns, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { report: { $ref: '#/components/schemas/Report' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/sites/{id}/rotate:
    post:
      summary: A new path, names and snippet (scope sites); the old path is counted for 30 more days
      description: An external site keeps its path for life (`invalid_request`).
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Rotated, content: { application/json: { schema: { type: object, properties: { site: { $ref: '#/components/schemas/Site' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/billing:
    get:
      summary: The balance, Pro and the last 50 journal rows (scope billing)
      description: |
        Money is integer micro-USD (1 USD = 1,000,000). Pro — the `api` plan — is $9 per 30 days,
        charged by the UTC day from the balance (docs/spec.md §18).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Billing' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/billing/invoices:
    post:
      summary: A crypto top-up (scope billing)
      description: |
        Whole dollars, 9 to 1,000, in one of four coins; at most 3 pending whose hour has not run out (`invoice_limit`).
        The answer has the address and the exact amount to send, fees included, for an hour; what
        arrives is credited, partial payments go to an operator. Needs a confirmed e-mail.
        `payments_unavailable` when the processor is not set up or did not answer. Telegram Stars
        are paid in the bot (/pay), not here.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [usd, coin]
              properties:
                usd: { type: integer, minimum: 9, maximum: 1000 }
                coin: { type: string, enum: [USDT_TRC20, USDT_BSC, USDT_ERC20, USDC_ERC20] }
      responses:
        '201': { description: Made, content: { application/json: { schema: { type: object, properties: { invoice: { $ref: '#/components/schemas/Invoice' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/billing/invoices/{id}:
    get:
      summary: A top-up and its state (scope billing)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { invoice: { $ref: '#/components/schemas/Invoice' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/billing/refunds:
    post:
      summary: Ask for a refund of a top-up (page session only)
      description: |
        A credited top-up under 90 days old, one open request per top-up (`refund_open`). An
        operator makes it: at most what that top-up brought in less what was refunded from it, and
        never more than the balance. Crypto goes, less the network fee, to `address` — yours, on the
        network the top-up came by (Tron for USDT_TRC20, an 0x address for the others); Stars go back
        whole, in Telegram, with no address.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id]
              properties:
                invoice_id: { type: string }
                address: { type: string }
      responses:
        '201': { description: Asked, content: { application/json: { schema: { type: object, properties: { refund: { $ref: '#/components/schemas/Refund' } } } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/partner:
    get:
      summary: The partner program — your code, links, referrals and wallet (scope billing)
      description: |
        Every user is a partner (docs/spec.md §19): 30% of each credited top-up of the people you
        referred, for life, one level, held 30 days. Your links: `https://clx.cx/?ref=CODE` and the
        bot's `start=ref_CODE`. Money is integer micro-USD; the wallet's available sum leaves out
        commissions still held, and a refund of a referral's top-up takes its share back
        (`clawback`), which may take the wallet below zero.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Partner' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/partner/transfer:
    post:
      summary: Move money from the partner wallet to your clx balance (page session only)
      description: |
        At most what is available; needs a confirmed e-mail and an Idempotency-Key
        (`insufficient_balance` when the wallet does not have it).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [usd], properties: { usd: { type: number, exclusiveMinimum: 0, maximum: 100000, multipleOf: 0.01, description: 'dollars, at most cents' } } }
      responses:
        '200': { description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/Partner' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/partner/payouts:
    post:
      summary: Ask for a payout in USDT TRC-20 (page session only)
      description: |
        From $20, to a Tron address, at most what is available; its money is reserved at once and
        an operator sends it by hand, or refuses it and the money returns. Needs a confirmed e-mail
        and an Idempotency-Key.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [usd, address]
              properties:
                usd: { type: number, minimum: 20, maximum: 100000, multipleOf: 0.01, description: 'dollars, at most cents' }
                address: { type: string, description: 'a USDT TRC-20 (Tron) address' }
      responses:
        '201':
          description: Asked
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Partner' }, { type: object, properties: { payout_id: { type: integer } } }] } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/billing/pro:
    post:
      summary: Switch Pro on or off (scope billing)
      description: |
        On needs a confirmed e-mail and at least $9 on the balance (`insufficient_balance`), and
        charges today; a day is charged once, however often Pro is switched. Off ends Pro after today
        (or at its first unpaid day, which is then not owed); the account returns to free and what is
        beyond its limits is paused, not deleted.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [on], properties: { on: { type: boolean } } }
      responses:
        '200': { description: Switched, content: { application/json: { schema: { $ref: '#/components/schemas/Billing' } } } }
        default: { $ref: '#/components/responses/Error' }
