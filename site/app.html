<!doctype html>
<!-- The app's page, one per language (site/build.ts: /app, /ru/app). The language here is the one of
     the address, used until the person signs in; then the account's, and the app moves to that
     language's address (ADR 0015). The site's header and footer are printed in by site/build.ts;
     ui/main.ts draws the app's sections (#shell) and everything inside <main>. -->
<html lang="%LANG%" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>clx</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/theme.js"></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
%HEADER%
    <div class="app-nav" id="shell"></div>
    <main id="app"></main>
%FOOTER%
  </body>
</html>
